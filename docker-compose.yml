services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: sentinel-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    networks:
      - sentinel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  falkordb_data:

networks:
  sentinel:
    driver: bridge